# ReviewPulse local infrastructure.
# All ports bind to 127.0.0.1 only: nothing here is reachable from other machines.
# Memory limits are deliberately small so the stack fits on a laptop.
name: reviewpulse

services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reviewpulse}
      POSTGRES_USER: ${POSTGRES_USER:-reviewpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reviewpulse-local-only}
    command: >
      postgres
        -c shared_buffers=128MB
        -c work_mem=16MB
        -c max_connections=50
        -c synchronous_commit=on
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.2.2
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by the backend with the configured partition count.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # 7 days. The index snapshot detects when retention has removed offsets it needs.
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  redis:
    image: redis:8.6.8-alpine
    # Cache only: no persistence, bounded memory with LRU eviction.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- Application (optional): docker compose --profile app up -d --build
  backend:
    profiles: ["app"]
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-reviewpulse}
      POSTGRES_USER: ${POSTGRES_USER:-reviewpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reviewpulse-local-only}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVIEWPULSE_ADMIN_TOKEN: ${REVIEWPULSE_ADMIN_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - index-data:/data/index
      - ./data/replay:/data/replay:ro
    mem_limit: 1536m

  frontend:
    profiles: ["app"]
    build: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_HOST: backend
      REVIEWPULSE_ADMIN_TOKEN: ${REVIEWPULSE_ADMIN_TOKEN:?set REVIEWPULSE_ADMIN_TOKEN in .env}
    ports:
      - "127.0.0.1:3000:80"
    mem_limit: 64m

volumes:
  pg-data:
  kafka-data:
  index-data:
