# ReviewPulse configuration. Values come from environment variables or ../.env (same file Compose reads).
# Defaults are LOCAL DEVELOPMENT values for a database bound to 127.0.0.1 only.
spring:
  application:
    name: reviewpulse
  config:
    import: "optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/${POSTGRES_DB:reviewpulse}
    username: ${POSTGRES_USER:reviewpulse}
    password: ${POSTGRES_PASSWORD:reviewpulse-local-only}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 5000
      validation-timeout: 2000
      # Probe idle connections so ones silently broken by a network partition are evicted.
      keepalive-time: 30000
      max-lifetime: 600000
      data-source-properties:
        # Seconds. Without these, a paused/partitioned database hangs request threads indefinitely.
        connectTimeout: 5
        socketTimeout: 15
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # A cache must fail fast: a slow Redis may never slow searches down by more than this.
      timeout: 150ms
      connect-timeout: 300ms

server:
  # Trust boundary: bind to loopback only. See docs/security.md before exposing anything.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB

reviewpulse:
  search:
    query-budget-millis: ${REVIEWPULSE_QUERY_BUDGET_MILLIS:2000}
    default-page-size: 20
  admin:
    # Required for /api/admin/**. Empty = admin endpoints disabled (fail closed).
    token: ${REVIEWPULSE_ADMIN_TOKEN:}
  index:
    build-fetch-size: 2000
    indexer-enabled: true
    snapshot-enabled: true
    snapshot-dir: ${REVIEWPULSE_SNAPSHOT_DIR:../data/index}
    snapshot-interval-seconds: 30
    import-check-seconds: 15
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:${KAFKA_PORT:9092}}
    topic: review-events
    dead-letter-topic: review-events.dlt
    partitions: 3
    consumer-group: reviewpulse-indexer
    poll-timeout-millis: 250
    max-poll-records: 500
    api-timeout-millis: 10000
  cache:
    # Off by default: at 100K reviews the in-process index answers faster than a Redis round trip on
    # this setup, and end-to-end runs showed no consistent benefit (docs/benchmark-results.md).
    enabled: ${REVIEWPULSE_CACHE_ENABLED:false}
    ttl-seconds: 60
    bypass-millis: 5000
  replay:
    dir: ${REVIEWPULSE_REPLAY_DIR:../data/replay}
  rate-limit:
    enabled: ${REVIEWPULSE_RATE_LIMIT_ENABLED:true}
    reads-per-second: ${REVIEWPULSE_READS_PER_SECOND:100}
    writes-per-second: ${REVIEWPULSE_WRITES_PER_SECOND:20}
    burst-seconds: 2
    max-body-bytes: 131072
  outbox:
    poll-interval-millis: 100
    batch-size: 500
    send-timeout-millis: 10000
    max-backoff-millis: 10000
    retention-hours: 24

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    # Redis is an optional cache; its outage must not mark the application DOWN.
    redis:
      enabled: false

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui

logging:
  level:
    root: INFO
    com.reviewpulse: INFO
    org.apache.kafka: WARN
